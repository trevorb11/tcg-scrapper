{% extends "base.html" %}

{% block title %}Page Not Found - Industry Deep Scan{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="text-center">
        <div class="mb-8">
            <span class="text-9xl font-bold text-indigo-200">404</span>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-4">Page Not Found</h1>
        <p class="text-lg text-gray-600 mb-8">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="flex gap-4 justify-center">
            <a href="/dashboard" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                <i class="fas fa-home mr-2"></i>
                Go to Dashboard
            </a>
            <a href="/dashboard/leads" class="inline-flex items-center px-6 py-3 border border-gray-300 text-base font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                <i class="fas fa-users mr-2"></i>
                View Leads
            </a>
        </div>
        <div class="mt-12">
            <p class="text-sm text-gray-500">
                If you believe this is an error, please contact support.
            </p>
        </div>
    </div>
</div>
{% endblock %}
