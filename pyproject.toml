[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industry-deep-scan"
version = "1.0.0"
description = "AI-powered industry signal scanner for MCA lead generation - detects funding triggers in real-time"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
authors = [
    { name = "TCG Brokerage" }
]
keywords = ["mca", "lead-generation", "web-scraping", "llm", "business-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core async framework
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",

    # Web scraping
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "playwright>=1.40.0",
    "feedparser>=6.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",

    # API framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # LLM integration
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "tiktoken>=0.5.0",

    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Scheduling
    "apscheduler>=3.10.0",
    "celery[redis]>=5.3.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "orjson>=3.9.0",
    "pandas>=2.1.0",
    "geopy>=2.4.0",

    # Notifications
    "slack-sdk>=3.26.0",
    "sendgrid>=6.11.0",

    # CLI
    "typer>=0.9.0",
    "rich>=13.7.0",

    # Export formats
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
deepscan = "industry_deep_scan.cli:app"

[project.urls]
Homepage = "https://github.com/tcg-brokerage/industry-deep-scan"

[tool.hatch.build.targets.wheel]
packages = ["src/industry_deep_scan"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
